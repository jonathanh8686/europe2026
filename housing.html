<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Housing – Europe 2026</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="back-link" href="index.html">← Map</a>
    <div class="hspacer"></div>
    <div class="site-title" style="font-size:1.05rem">Housing</div>
    <div class="hspacer"></div>
    <a class="btn-ghost" href="expenses.html">Expenses</a>
  </header>
  <main class="housing-page" id="housingPage">
    <p style="color:var(--muted);padding:40px 0">Loading…</p>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
  var CITY_PAGES  = { Bologna: 'bologna.html', Milan: 'milan.html', Interlaken: 'interlaken.html', Zurich: 'zurich.html' };
  var STOP_COLORS = ['#C1603A', '#5C86AC', '#5B9668', '#93639C'];
  var GROUP_SIZE  = 9; // price-per-person is always split across the full group
  var mapsToInit  = []; // queued Leaflet maps — instantiated after innerHTML is set

  function fmtShort(s) {
    return s ? new Date(s + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) : '';
  }
  function addDays(s, n) {
    var d = new Date(s + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return d.toISOString().slice(0, 10);
  }
  function money(n) {
    return '$' + Math.round(n).toLocaleString('en-US');
  }

  fetch('data.json')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      renderHousing(data.itinerary || [], data.hotels || []);
    })
    .catch(function() {
      document.getElementById('housingPage').innerHTML =
        '<p style="color:var(--muted);padding:40px 0">Failed to load trip data.</p>';
    });

  // "picked" = the group has settled on this one, but it's not reserved/paid
  // yet. "booked" = an actual confirmed reservation. "searching" = no
  // candidates added yet. Plain "candidate" rows (still comparing) get no
  // badge — none of them is singled out as a "top pick".
  function badgeInfo(h) {
    if (h.status === 'booked')    return { cls: 'booked',    label: 'Booked' };
    if (h.status === 'picked')    return { cls: 'picked',    label: '✓ Picked' };
    if (h.status === 'searching') return { cls: 'searching', label: 'Searching' };
    return null;
  }

  // Total-price listings show a real per-night / per-person breakdown (split
  // across the fixed group size of 9). Placeholder rows only have a rough
  // per-night budget estimate, so they get a lighter "~estimate" treatment.
  function buildPriceBox(h) {
    if (h.totalPrice) {
      var perNight       = h.totalPrice / (h.nights || 1);
      var perPerson      = h.totalPrice / GROUP_SIZE;
      var perPersonNight = perNight / GROUP_SIZE;
      return '<div class="housing-price-box">' +
        '<span class="housing-price-total">' + money(h.totalPrice) + ' total</span>' +
        '<span class="housing-price-pp">' + money(perPerson) + '/person</span>' +
        '<span class="housing-price-sub">' + money(perNight) + '/night · ' + money(perPersonNight) + '/person/night · 9 guests</span>' +
      '</div>';
    }
    if (h.pricePerNight) {
      var estPerPerson = h.pricePerNight / GROUP_SIZE;
      return '<div class="housing-price-box tbd">' +
        '<span class="housing-price-total">~' + money(h.pricePerNight) + '/night (est.)</span>' +
        '<span class="housing-price-pp">~' + money(estPerPerson) + '/person/night</span>' +
      '</div>';
    }
    return '<div class="housing-price-box tbd"><span class="housing-price-total">Price TBD</span></div>';
  }

  // Small status line about the actual reservation, separate from the
  // "picked" badge — the group has decided, but that's not the same as
  // money changing hands yet.
  function buildReservationNote(h) {
    if (h.status === 'booked') {
      return '<div class="housing-reservation booked">✓ Reservation confirmed' + (h.confirmation && h.confirmation !== 'TBD' ? ' · Conf# ' + h.confirmation : '') + '</div>';
    }
    if (h.status === 'picked') {
      return '<div class="housing-reservation pending">Group has decided — not yet booked/paid</div>';
    }
    return '';
  }

  function buildOptionCard(h, stop, color) {
    var badge  = badgeInfo(h);
    var isReal = !!(h.url && h.status !== 'searching');

    var img = isReal
      ? '<img class="housing-img" src="' + h.image + '" alt="' + h.name + '">'
      : '<div class="housing-img-placeholder">' + (stop.emoji || '🏠') + '</div>';

    var stats = '<div class="housing-stats">';
    if (h.guests)    stats += '<span class="housing-stat">👥 ' + h.guests + ' guests</span>';
    if (h.bedrooms)  stats += '<span class="housing-stat">🛏️ ' + h.bedrooms + ' bd</span>';
    if (h.beds)      stats += '<span class="housing-stat">🛌 ' + h.beds + ' beds</span>';
    if (h.bathrooms) stats += '<span class="housing-stat">🛁 ' + h.bathrooms + ' ba</span>';
    if (h.rating)    stats += '<span class="housing-stat housing-rating">★ ' + h.rating.toFixed(2).replace(/0$/, '') + (h.reviews ? ' (' + h.reviews + ')' : '') + '</span>';
    stats += '</div>';

    var nameHtml = isReal
      ? '<a href="' + h.url + '" target="_blank" rel="noopener">' + h.name + '</a>'
      : h.name;

    var mapHtml = '';
    if (h.coords && h.coords.length === 2) {
      var mapId = 'hmap-' + h.id;
      mapsToInit.push({ id: mapId, coords: h.coords, color: color, label: h.name });
      mapHtml = '<div class="housing-map" id="' + mapId + '"></div>' +
        '<div class="housing-map-caption">📍 Approximate location — based on the listed neighborhood, not the exact address</div>';
    }

    return '<div class="housing-card' + (h.status === 'searching' ? ' tbd' : '') +
      '" style="border-top-color:' + color + '">' +
      (badge ? '<div class="housing-card-head"><span class="housing-badge ' + badge.cls + '">' + badge.label + '</span></div>' : '') +
      img +
      '<div class="housing-body">' +
        '<div class="housing-name">' + nameHtml + '</div>' +
        (h.address ? '<div class="housing-location">📍 ' + h.address + '</div>' : '') +
        (h.checkIn ? '<div class="housing-dates">' + fmtShort(h.checkIn) + ' – ' + fmtShort(h.checkOut) + ' · ' + h.nights + ' night' + (h.nights !== 1 ? 's' : '') +
          (h.checkInTime ? ' · in ' + h.checkInTime + (h.checkOutTime ? ', out ' + h.checkOutTime : '') : '') + '</div>' : '') +
        (h.host ? '<div class="housing-host">Hosted by ' + h.host + '</div>' : '') +
        stats +
        buildPriceBox(h) +
        buildReservationNote(h) +
        (h.notes ? '<div class="housing-notes">' + h.notes + '</div>' : '') +
        mapHtml +
        (isReal ? '<a class="housing-link" href="' + h.url + '" target="_blank" rel="noopener">View on Airbnb →</a>' : '') +
      '</div></div>';
  }

  function renderHousing(itin, hotels) {
    mapsToInit = [];
    var stops = itin.filter(function(s) { return s.city !== 'Home'; });
    var pickedCities    = [];
    var comparingCities = [];
    var totalCost       = 0;
    var totalNights     = 0;
    var pricedCount     = 0;

    var sections = stops.map(function(stop, i) {
      var color   = STOP_COLORS[i] || '#DD8452';
      var page    = CITY_PAGES[stop.city] || '#';
      var options = hotels.filter(function(x) { return x.city === stop.city; });

      // If the group has settled on a pick (or actually booked something),
      // only show that — otherwise fall back to the full side-by-side
      // comparison of candidates still being weighed.
      var finalists = options.filter(function(h) { return h.status === 'picked' || h.status === 'booked'; });
      var isDecided = finalists.length > 0;
      var shown     = isDecided ? finalists : options;

      if (isDecided) {
        pickedCities.push(stop.city);
        finalists.forEach(function(h) {
          if (h.totalPrice) { totalCost += h.totalPrice; pricedCount++; }
        });
        totalNights += stop.nights || 0;
      } else if (options.length) {
        comparingCities.push(stop.city);
      }

      var checkOut = fmtShort(addDays(stop.date, stop.nights || 0));

      var cardsHtml = shown.length
        ? shown.map(function(h) { return buildOptionCard(h, stop, color); }).join('')
        : '<div class="housing-card tbd" style="border-top-color:' + color + '">' +
            '<div class="housing-card-head"><span class="housing-badge searching">Searching</span></div>' +
            '<div class="housing-img-placeholder">' + (stop.emoji || '🏠') + '</div>' +
            '<div class="housing-body"><div class="housing-name" style="color:var(--muted)">No options added yet</div></div>' +
          '</div>';

      return '<div class="housing-city-col">' +
        '<div class="housing-city-heading">' +
          '<span class="housing-city-num" style="background:' + color + '">' + (i + 1) + '</span>' +
          '<a class="housing-city-title" href="' + page + '">' + (stop.flag || '') + ' ' + stop.city + '</a>' +
        '</div>' +
        '<div class="housing-city-dates">' + fmtShort(stop.date) + ' – ' + checkOut + ' · ' + stop.nights + ' night' + (stop.nights !== 1 ? 's' : '') + '</div>' +
        '<div class="housing-col-cards">' + cardsHtml + '</div>' +
      '</div>';
    }).join('');

    var introBits = [];
    if (pickedCities.length)    introBits.push('Housing is picked for ' + joinNice(pickedCities) + '.');
    if (comparingCities.length) introBits.push('Still comparing options for ' + joinNice(comparingCities) + '.');
    var intro = (introBits.length ? introBits.join(' ') : 'Comparing Airbnb options — nothing decided yet.') +
      ' Prices are split ' + GROUP_SIZE + ' ways.';

    // Grand-total summary bar — only meaningful once at least one city has
    // a priced pick locked in.
    var summaryHtml = '';
    if (pricedCount > 0) {
      var perPersonTotal = totalCost / GROUP_SIZE;
      var partial = pricedCount < pickedCities.length ? ' (partial — some picks still missing a price)' : '';
      summaryHtml =
        '<div class="housing-summary">' +
          '<div class="housing-summary-item"><span class="hs-label">Total housing' + partial + '</span><span class="hs-value accent">' + money(totalCost) + '</span></div>' +
          '<div class="housing-summary-item"><span class="hs-label">Per person</span><span class="hs-value">' + money(perPersonTotal) + '</span></div>' +
          '<div class="housing-summary-item"><span class="hs-label">Total nights</span><span class="hs-value">' + totalNights + '</span></div>' +
          '<div class="housing-summary-item"><span class="hs-label">Cities decided</span><span class="hs-value">' + pickedCities.length + ' / ' + stops.length + '</span></div>' +
        '</div>';
    }

    document.getElementById('housingPage').innerHTML =
      '<p class="housing-intro">' + intro + '</p>' +
      summaryHtml +
      '<div class="housing-columns">' + sections + '</div>';

    initHousingMaps();
  }

  // Small, non-interactive-feeling location maps — one per card, centered on
  // an approximate neighborhood point (Airbnb doesn't expose exact
  // coordinates in the listing data, only the general area).
  function initHousingMaps() {
    mapsToInit.forEach(function(m) {
      var el = document.getElementById(m.id);
      if (!el || typeof L === 'undefined') return;
      var map = L.map(m.id, { zoomControl: false, attributionControl: false, scrollWheelZoom: false })
        .setView(m.coords, 14);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 18, subdomains: 'abcd' }).addTo(map);
      var icon = L.divIcon({
        className: 'c-marker',
        html: '<div class="c-pin" style="width:26px;height:26px;background:' + m.color + '">' +
              '<span style="font-size:0.7rem">🏠</span></div>',
        iconSize: [26, 26], iconAnchor: [13, 26], popupAnchor: [0, -28]
      });
      L.marker(m.coords, { icon: icon }).addTo(map);
    });
  }

  function joinNice(arr) {
    if (arr.length <= 1) return arr.join('');
    if (arr.length === 2) return arr[0] + ' & ' + arr[1];
    return arr.slice(0, -1).join(', ') + ' & ' + arr[arr.length - 1];
  }
  </script>
</body>
</html>
