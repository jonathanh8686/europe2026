<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Europe 2026 ✈️</title>
  <style>
    :root {
      --navy: #0f1b2d;
      --blue: #1e5fa8;
      --blue-light: #2d7dd2;
      --accent: #f5a623;
      --green: #27ae60;
      --text: #e8edf5;
      --text-muted: #8fa3bc;
      --card: #162338;
      --card-border: #1f3454;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--navy);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #0a1628 0%, #1a2d47 60%, #1e4080 100%);
      border-bottom: 1px solid var(--card-border);
      padding: 40px 32px;
      text-align: center;
    }

    .trip-title {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .trip-title span {
      color: var(--navy);
    }

    .trip-meta {
      font-size: 1rem;
      color: var(--text-muted);
    }

    main {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 32px;
    }

    .main-row {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    .calendar-container {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 16px;
      flex-shrink: 0;
      width: 220px;
    }

    .calendar-header {
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      margin-bottom: 4px;
    }

    .weekday {
      text-align: center;
      font-weight: 600;
      color: var(--text-muted);
      padding: 2px 0;
      font-size: 0.6rem;
      text-transform: uppercase;
    }

    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }

    .day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      font-weight: 500;
      cursor: default;
      border: 1px solid transparent;
      background: #0f1b2d;
      color: var(--text-muted);
      font-size: 0.65rem;
    }

    .day.other-month {
      color: #2d4563;
      background: transparent;
    }

    .day.trip-day {
      background: linear-gradient(135deg, #1e5fa8 0%, #2d7dd2 100%);
      color: var(--text);
      border-color: var(--accent);
    }

    .attendees-container {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 24px;
      flex: 1;
      min-width: 0;
    }

    .attendees-header {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .attendee-count {
      background: rgba(30, 95, 168, 0.1);
      border: 1px solid rgba(30, 95, 168, 0.3);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 16px;
      color: var(--blue-light);
      font-size: 0.85rem;
    }

    .attendee-count strong {
      color: var(--text);
    }

    .attendees-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .attendee {
      background: #0f1b2d;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s;
    }

    .attendee:hover {
      background: #1a2d47;
      border-color: var(--blue-light);
    }

    .attendee-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1e5fa8 0%, #2d7dd2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.75rem;
      color: var(--text);
      flex-shrink: 0;
    }

    .attendee-avatar.pending {
      background: linear-gradient(135deg, #44475a 0%, #6272a4 100%);
    }

    .attendee-avatar.not-going {
      background: linear-gradient(135deg, #5a2020 0%, #8b3a3a 100%);
    }

    .attendee-info {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .attendee-name {
      font-weight: 600;
      color: var(--text);
      font-size: 0.9rem;
    }

    .attendee-status {
      font-size: 0.72rem;
      color: var(--green);
      white-space: nowrap;
    }

    .attendee-status.pending {
      color: #8fa3bc;
    }

    .attendee-status.not-going {
      color: #e74c3c;
    }

    @media (max-width: 700px) {
      header { padding: 30px 20px; }
      .trip-title { font-size: 1.8rem; }
      main { padding: 0 20px; margin: 30px auto; }
      .main-row { flex-direction: column; }
      .calendar-container { width: 100%; }
    }
  </style>
</head>
<body>

<header>
  <div class="trip-title">🌍 Europe <span>2026</span></div>
  <div class="trip-meta" id="headerMeta">September 5 – 12, 2026</div>
</header>

<main>
  <div class="main-row">
    <div class="calendar-container">
      <div class="calendar-header">September 2026</div>
      <div class="weekdays">
        <div class="weekday">S</div>
        <div class="weekday">M</div>
        <div class="weekday">T</div>
        <div class="weekday">W</div>
        <div class="weekday">T</div>
        <div class="weekday">F</div>
        <div class="weekday">S</div>
      </div>
      <div class="days" id="calendar"></div>
    </div>

    <div class="attendees-container">
      <div class="attendees-header">👥 Attendees</div>
      <div class="attendee-count">
        <strong id="attendeeStats">Loading...</strong>
      </div>
      <div class="attendees-list" id="attendeesList"></div>
    </div>
  </div>
</main>

<script>
  function generateCalendar() {
    const year = 2026;
    const month = 8; // September (0-indexed)
    const tripStart = 5;
    const tripEnd = 12;

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const daysInPrevMonth = new Date(year, month, 0).getDate();

    const calendarDiv = document.getElementById('calendar');
    calendarDiv.innerHTML = '';

    for (let i = firstDay - 1; i >= 0; i--) {
      const day = document.createElement('div');
      day.className = 'day other-month';
      day.textContent = daysInPrevMonth - i;
      calendarDiv.appendChild(day);
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const dayDiv = document.createElement('div');
      dayDiv.className = 'day';
      dayDiv.textContent = day;
      if (day >= tripStart && day <= tripEnd) dayDiv.classList.add('trip-day');
      calendarDiv.appendChild(dayDiv);
    }
  }

  function renderAttendees(attendees) {
    const list = document.getElementById('attendeesList');
    const statsDiv = document.getElementById('attendeeStats');
    const confirmed = attendees.filter(a => a.confirmed);
    const notGoing = attendees.filter(a => !a.confirmed && a.notGoing);
    const pending = attendees.filter(a => !a.confirmed && !a.notGoing);

    statsDiv.textContent = `${confirmed.length} confirmed · ${pending.length} pending · ${notGoing.length} not going`;

    const html = [
      ...confirmed.map(a => `
        <div class="attendee">
          <div class="attendee-avatar">${a.name.charAt(0)}</div>
          <div class="attendee-info">
            <div class="attendee-name">${a.name}</div>
            <div class="attendee-status">✓ Going</div>
          </div>
        </div>
      `),
      ...pending.map(a => `
        <div class="attendee">
          <div class="attendee-avatar pending">${a.name.charAt(0)}</div>
          <div class="attendee-info">
            <div class="attendee-name">${a.name}</div>
            <div class="attendee-status pending">⏳ Pending</div>
          </div>
        </div>
      `),
      ...notGoing.map(a => `
        <div class="attendee">
          <div class="attendee-avatar not-going">${a.name.charAt(0)}</div>
          <div class="attendee-info">
            <div class="attendee-name">${a.name}</div>
            <div class="attendee-status not-going">✗ Not going</div>
          </div>
        </div>
      `)
    ].join('');

    list.innerHTML = html;
  }

  function loadAttendees() {
    fetch('data.json')
      .then(res => res.json())
      .then(data => renderAttendees(data.attendees))
      .catch(() => {
        renderAttendees([
          { name: 'Jonathan Hsieh', confirmed: true },
          { name: 'Sean Chen', confirmed: true },
          { name: 'Derek Wen', confirmed: true },
          { name: 'Yongjae Lee', confirmed: true },
          { name: 'Tompson Hsu', confirmed: false, notGoing: true },
          { name: 'Kyle Lu', confirmed: false, notGoing: true },
          { name: 'Aiden Zhang', confirmed: false },
          { name: 'Andy Nilipour', confirmed: false },
          { name: 'Anthony Yao', confirmed: false },
          { name: 'Brian Zhu', confirmed: false },
          { name: 'Demitrius Hong', confirmed: false },
          { name: 'Michael Chen', confirmed: false },
          { name: 'Shreyank Kadadi', confirmed: false },
          { name: 'Trevor Guo', confirmed: false }
        ]);
      });
  }

  generateCalendar();
  loadAttendees();
</script>

</body>
</html>
