<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Europe 2026</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="site-title">Europe <em>2026</em></div>
  <div class="site-meta" id="headerMeta">Sep 5 – 11, 2026</div>
  <div class="hspacer"></div>
  <button class="btn-ghost" id="sidebarToggle">👥 <span id="goingCount">9</span> going</button>
</header>

<div class="map-wrap">
  <div id="map"></div>

  <!-- Attendee sidebar — floats over the map, hidden by default -->
  <div class="sidebar-panel hidden" id="sidebarPanel">
    <div id="attendeeChips"></div>
  </div>
</div>

<!-- City stop strip -->
<div class="city-strip" id="cityStrip"></div>

<!-- Suggested cities (collapsed by default) -->
<div class="picks-section">
  <button class="picks-toggle-btn" id="picksToggle">🌍 Show suggested cities ▾</button>
  <div class="cpicks-grid" id="picksGrid" style="display:none"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
var CITY_PAGES  = { Bologna: 'bologna.html', Milan: 'milan.html', Interlaken: 'interlaken.html', Zurich: 'zurich.html' };
var STOP_COLORS = ['#1e5fa8', '#f5a623', '#27ae60', '#9b59b6'];

// Fallback coords for any city referenced without coords in the JSON
var FALLBACK_COORDS = {
  Bologna: [44.4939, 11.3426], Milan: [45.4642, 9.19],
  Interlaken: [46.6863, 8.1638], Zurich: [47.3769, 8.5417],
  Rome: [41.9028, 12.4964], London: [51.5074, -0.1278],
  Paris: [48.8566, 2.3522], Amsterdam: [52.3676, 4.9041],
  Munich: [48.1351, 11.582], Ljubljana: [46.0569, 14.5058]
};

function coords(city, obj) {
  return (obj && obj.coords && obj.coords.length) ? obj.coords : (FALLBACK_COORDS[city] || null);
}

function fmtShort(s) {
  return s ? new Date(s + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';
}
function addDays(s, n) {
  var d = new Date(s + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
}

// ── Sidebar toggle ──────────────────────────────────────────────────────────
document.getElementById('sidebarToggle').addEventListener('click', function() {
  document.getElementById('sidebarPanel').classList.toggle('hidden');
});

// ── City picks toggle ───────────────────────────────────────────────────────
var picksOpen = false;
document.getElementById('picksToggle').addEventListener('click', function() {
  picksOpen = !picksOpen;
  document.getElementById('picksGrid').style.display = picksOpen ? 'grid' : 'none';
  this.textContent = picksOpen ? '🌍 Hide suggested cities ▴' : '🌍 Show suggested cities ▾';
});

// ── Load data ───────────────────────────────────────────────────────────────
fetch('data.json')
  .then(function(r) { return r.json(); })
  .then(function(data) {
    var attendees = data.attendees || [];
    var confirmed = attendees.filter(function(a) { return a.confirmed; });
    document.getElementById('goingCount').textContent = confirmed.length;

    renderSidebar(attendees);

    var itin = (data.itinerary || []).filter(function(s) { return s.city !== 'Home'; });
    renderCityStrip(itin);
    initMap(itin, data.citySuggestions || []);
    renderPicks(data.citySuggestions || []);
  });

// ── Sidebar: attendee list ──────────────────────────────────────────────────
function renderSidebar(attendees) {
  var confirmed = attendees.filter(function(a) { return a.confirmed; });
  var notGoing  = attendees.filter(function(a) { return !a.confirmed && a.notGoing; });

  function chip(a, cls, tag) {
    return '<div class="att-chip">' +
      '<div class="chip-av ' + cls + '">' + a.name.charAt(0) + '</div>' +
      '<span class="chip-name">' + a.name.split(' ')[0] + '</span>' +
      '<span class="chip-tag ' + cls + '">' + tag + '</span>' +
      '</div>';
  }

  var html = '<div class="sb-title">✅ Going (' + confirmed.length + ')</div>';
  html += confirmed.map(function(a) { return chip(a, 'yes', 'Going'); }).join('');
  if (notGoing.length) {
    html += '<hr class="sdiv"><div class="sb-title">❌ Not going</div>';
    html += notGoing.map(function(a) { return chip(a, 'no', 'No'); }).join('');
  }
  document.getElementById('attendeeChips').innerHTML = html;
}

// ── City strip ──────────────────────────────────────────────────────────────
function renderCityStrip(itin) {
  var strip = document.getElementById('cityStrip');
  strip.innerHTML = itin.map(function(stop, i) {
    var page = CITY_PAGES[stop.city] || '#';
    var out  = stop.nights > 0 ? fmtShort(addDays(stop.date, stop.nights)) : '';
    return '<a class="city-stop-link" href="' + page + '">' +
      '<div class="csl-num">Stop ' + (i + 1) + ' ' + (stop.flag || '') + '</div>' +
      '<div class="csl-name">' + (stop.emoji || '') + ' ' + stop.city + '</div>' +
      '<div class="csl-dates">' + fmtShort(stop.date) + (out ? ' – ' + out : '') + '</div>' +
      (stop.nights > 0 ? '<span class="csl-badge">' + stop.nights + ' night' + (stop.nights !== 1 ? 's' : '') + '</span>' : '') +
      '</a>';
  }).join('');
}

// ── Map ─────────────────────────────────────────────────────────────────────
function initMap(itin, suggestions) {
  var map = L.map('map', { zoomControl: true });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 18
  }).addTo(map);

  var allCoords = [];

  // Suggested cities — subtle, smaller markers
  suggestions
    .filter(function(s) { return s.status === 'suggested'; })
    .forEach(function(s) {
      var c = coords(s.name, s);
      if (!c) return;
      allCoords.push(c);
      var icon = L.divIcon({
        className: 'c-marker',
        html: '<div class="c-pin" style="width:22px;height:22px;background:#1e2e45;border-color:rgba(143,163,188,0.25)">' +
              '<span style="font-size:0.7rem">' + (s.emoji || '●') + '</span></div>',
        iconSize: [22, 22], iconAnchor: [11, 22], popupAnchor: [0, -26]
      });
      L.marker(c, { icon: icon }).addTo(map)
        .bindPopup('<strong>' + (s.flag || '') + ' ' + s.name + '</strong>' +
                   '<br><span style="font-size:0.75rem;color:var(--muted)">' + s.country + ' · Suggested</span>');
    });

  // Planned route line
  var routeCoords = itin.map(function(s) { return coords(s.city, s); }).filter(Boolean);
  if (routeCoords.length > 1) {
    L.polyline(routeCoords, { color: '#2d7dd2', weight: 2.5, opacity: 0.65, dashArray: '6 4' }).addTo(map);
  }

  // Planned stop markers — prominent, numbered, link to city page
  itin.forEach(function(stop, i) {
    var c = coords(stop.city, stop);
    if (!c) return;
    allCoords.push(c);
    var color = STOP_COLORS[i % STOP_COLORS.length];
    var page  = CITY_PAGES[stop.city] || '#';
    var out   = stop.nights > 0 ? fmtShort(addDays(stop.date, stop.nights)) : '';

    var icon = L.divIcon({
      className: 'c-marker',
      html: '<div class="c-pin" style="width:32px;height:32px;background:' + color + '">' +
            '<span style="font-size:0.8rem">' + (i + 1) + '</span></div>',
      iconSize: [32, 32], iconAnchor: [16, 32], popupAnchor: [0, -36]
    });

    L.marker(c, { icon: icon }).addTo(map).bindPopup(
      '<strong>' + (stop.flag || '') + ' ' + stop.city + '</strong>, ' + stop.country +
      '<br>' + fmtShort(stop.date) + (out ? ' – ' + out : '') +
      (stop.nights > 0 ? ' · ' + stop.nights + ' night' + (stop.nights !== 1 ? 's' : '') : '') +
      (stop.notes ? '<br><em style="font-size:0.74rem;color:var(--muted)">' + stop.notes + '</em>' : '') +
      '<br><a class="popup-cta" href="' + page + '">View city →</a>'
    );
  });

  if (allCoords.length) map.fitBounds(allCoords, { padding: [44, 44] });
}

// ── City picks grid ─────────────────────────────────────────────────────────
function renderPicks(suggestions) {
  document.getElementById('picksGrid').innerHTML = suggestions.map(function(c) {
    return '<div class="cpick ' + c.status + '">' +
      '<div class="cpick-top">' +
        '<div class="cpick-emo">' + (c.emoji || '') + '</div>' +
        '<div>' +
          '<div class="cpick-nm">' + (c.flag || '') + ' ' + c.name +
            ' <span class="cpick-badge ' + c.status + '">' +
              (c.status === 'planned' ? 'Planned' : 'Suggested') +
            '</span>' +
          '</div>' +
          '<div class="cpick-co">' + c.country + '</div>' +
        '</div>' +
      '</div>' +
      (c.blurb ? '<div class="cpick-blurb">' + c.blurb + '</div>' : '') +
      '</div>';
  }).join('');
}
</script>

</body>
</html>
