<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Europe 2026 ✈️</title>
  <style>
    :root {
      --navy: #0f1b2d;
      --blue: #1e5fa8;
      --blue-light: #2d7dd2;
      --accent: #f5a623;
      --green: #27ae60;
      --text: #e8edf5;
      --text-muted: #8fa3bc;
      --card: #162338;
      --card-border: #1f3454;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--navy);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #0a1628 0%, #1a2d47 60%, #1e4080 100%);
      border-bottom: 1px solid var(--card-border);
      padding: 40px 32px;
      text-align: center;
    }

    .trip-title {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .trip-title span {
      color: var(--navy);
    }

    .trip-meta {
      font-size: 1rem;
      color: var(--text-muted);
    }

    main {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 32px;
    }

    .calendar-container {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 40px;
      max-width: 500px;
    }

    .calendar-header {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--card-border);
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }

    .weekday {
      text-align: center;
      font-weight: 600;
      color: var(--text-muted);
      padding: 6px 2px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      border: 2px solid transparent;
      background: #0f1b2d;
      color: var(--text-muted);
      font-size: 0.8rem;
      padding: 4px;
    }

    .day:hover {
      background: #1a2d47;
    }

    .day.other-month {
      color: #2d4563;
    }

    .day.trip-day {
      background: linear-gradient(135deg, #1e5fa8 0%, #2d7dd2 100%);
      color: var(--text);
      border-color: var(--accent);
      box-shadow: 0 4px 12px rgba(30, 95, 168, 0.3);
    }

    .day.trip-day:hover {
      background: linear-gradient(135deg, #2d7dd2 0%, #3a8fe6 100%);
      box-shadow: 0 6px 16px rgba(30, 95, 168, 0.4);
      transform: scale(1.05);
    }

    .attendees-container {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 30px;
    }

    .attendees-header {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .attendee-count {
      background: rgba(30, 95, 168, 0.1);
      border: 1px solid rgba(30, 95, 168, 0.3);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 25px;
      color: var(--blue-light);
    }

    .attendee-count strong {
      color: var(--text);
    }

    .attendees-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .attendee {
      background: #0f1b2d;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s;
    }

    .attendee:hover {
      background: #1a2d47;
      border-color: var(--blue-light);
    }

    .attendee-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1e5fa8 0%, #2d7dd2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--text);
      flex-shrink: 0;
    }

    .attendee-info {
      flex: 1;
    }

    .attendee-name {
      font-weight: 600;
      color: var(--text);
    }

    .attendee-status {
      font-size: 0.8rem;
      color: var(--green);
      margin-top: 2px;
    }

    .attendee-status.not-going {
      color: #d97706;
    }

    @media (max-width: 640px) {
      header { padding: 30px 20px; }
      .trip-title { font-size: 1.8rem; }
      main { padding: 0 20px; margin: 30px auto; }
      .calendar-container { padding: 20px; }
      .attendees-container { padding: 20px; }
    }
  </style>
</head>
<body>

<header>
  <div class="trip-title">🌍 Europe <span>2026</span></div>
  <div class="trip-meta">September 5 – 12, 2026 • 4 confirmed</div>
</header>

<main>
  <div class="calendar-container">
    <div class="calendar-header">September 2026</div>
    <div class="weekdays">
      <div class="weekday">Sun</div>
      <div class="weekday">Mon</div>
      <div class="weekday">Tue</div>
      <div class="weekday">Wed</div>
      <div class="weekday">Thu</div>
      <div class="weekday">Fri</div>
      <div class="weekday">Sat</div>
    </div>
    <div class="days" id="calendar"></div>
  </div>

  <div class="attendees-container">
    <div class="attendees-header">👥 Attendees</div>
    <div class="attendee-count">
      <strong id="attendeeStats">Loading...</strong>
    </div>
    <div class="attendees-list" id="attendeesList"></div>
  </div>
</main>

<script>
  function generateCalendar() {
    const year = 2026;
    const month = 8; // September (0-indexed)
    const tripStart = 5;
    const tripEnd = 12;

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const daysInPrevMonth = new Date(year, month, 0).getDate();

    const calendarDiv = document.getElementById('calendar');
    calendarDiv.innerHTML = '';

    // Previous month's days
    for (let i = firstDay - 1; i >= 0; i--) {
      const day = document.createElement('div');
      day.className = 'day other-month';
      day.textContent = daysInPrevMonth - i;
      calendarDiv.appendChild(day);
    }

    // Current month's days
    for (let day = 1; day <= daysInMonth; day++) {
      const dayDiv = document.createElement('div');
      dayDiv.className = 'day';
      dayDiv.textContent = day;

      if (day >= tripStart && day <= tripEnd) {
        dayDiv.classList.add('trip-day');
      }

      calendarDiv.appendChild(dayDiv);
    }

    // No next month's days - keep calendar compact
  }

  function loadAttendees() {
    fetch('data.json')
      .then(res => res.json())
      .then(data => {
        const list = document.getElementById('attendeesList');
        const statsDiv = document.getElementById('attendeeStats');
        const confirmedAttendees = data.attendees.filter(a => a.confirmed);
        const notConfirmedAttendees = data.attendees.filter(a => !a.confirmed);

        // Update stats
        statsDiv.textContent = `${confirmedAttendees.length} going, ${notConfirmedAttendees.length} not going`;

        const html = [
          ...confirmedAttendees.map(attendee => `
            <div class="attendee">
              <div class="attendee-avatar">${attendee.name.charAt(0)}</div>
              <div class="attendee-info">
                <div class="attendee-name">${attendee.name}</div>
                <div class="attendee-status">✓ Going</div>
              </div>
            </div>
          `),
          ...notConfirmedAttendees.map(attendee => `
            <div class="attendee">
              <div class="attendee-avatar">${attendee.name.charAt(0)}</div>
              <div class="attendee-info">
                <div class="attendee-name">${attendee.name}</div>
                <div class="attendee-status not-going">✗ Not going</div>
              </div>
            </div>
          `)
        ].join('');

        list.innerHTML = html;
      })
      .catch(err => {
        console.error('Error loading attendees:', err);
        // Fallback to hardcoded list
        const list = document.getElementById('attendeesList');
        const statsDiv = document.getElementById('attendeeStats');
        const attendees = [
          { name: 'Jonathan Hsieh', confirmed: true },
          { name: 'Sean Chen', confirmed: true },
          { name: 'Derek Wen', confirmed: true },
          { name: 'Yongjae Lee', confirmed: true },
          { name: 'Mark Tompson Hsu', confirmed: false },
          { name: 'Kyle Lu', confirmed: false }
        ];
        const going = attendees.filter(a => a.confirmed).length;
        const notGoing = attendees.filter(a => !a.confirmed).length;
        statsDiv.textContent = `${going} going, ${notGoing} not going`;
        list.innerHTML = attendees.map(a => `
          <div class="attendee">
            <div class="attendee-avatar">${a.name.charAt(0)}</div>
            <div class="attendee-info">
              <div class="attendee-name">${a.name}</div>
              <div class="attendee-status ${a.confirmed ? '' : 'not-going'}">${a.confirmed ? '✓ Going' : '✗ Not going'}</div>
            </div>
          </div>
        `).join('');
      });
  }

  generateCalendar();
  loadAttendees();
</script>

</body>
</html>
