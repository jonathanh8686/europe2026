<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Europe 2026</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="site-title">Europe <em>2026</em></div>
  <div class="site-meta" id="headerMeta"></div>
  <div class="hspacer"></div>
  <a class="btn-ghost" href="housing.html">Housing</a>
  <a class="btn-ghost" href="expenses.html">Expenses</a>
  <button class="btn-ghost" id="sidebarToggle"><span id="goingCount">9</span> confirmed</button>
</header>

<main>

  <!-- The calendar is the main focus of the homepage -->
  <section class="cal-hero">
    <div class="cal-hero-inner" id="calHero">
      <p style="color:var(--muted);font-size:0.82rem">Loading…</p>
    </div>
  </section>

  <div class="home-below">
    <div class="map-panel">
      <div id="map"></div>
      <!-- Attendee panel — overlays the map -->
      <div class="sidebar-panel hidden" id="sidebarPanel">
        <div id="attendeeChips"></div>
      </div>
    </div>

    <div class="stops-panel" id="stopsPanel">
      <p style="color:var(--muted);font-size:0.82rem">Loading…</p>
    </div>
  </div>

</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
var CITY_PAGES  = { Bologna: 'bologna.html', Milan: 'milan.html', Interlaken: 'interlaken.html', Zurich: 'zurich.html' };
var STOP_COLORS = ['#C1603A', '#5C86AC', '#5B9668', '#93639C'];
var FALLBACK_COORDS = {
  Bologna: [44.4939, 11.3426], Milan: [45.4642, 9.19],
  Interlaken: [46.6863, 8.1638], Zurich: [47.3769, 8.5417],
  Rome: [41.9028, 12.4964], London: [51.5074, -0.1278],
  Paris: [48.8566, 2.3522], Amsterdam: [52.3676, 4.9041],
  Munich: [48.1351, 11.582], Ljubljana: [46.0569, 14.5058]
};

function getCoords(city, obj) {
  return (obj && obj.coords && obj.coords.length) ? obj.coords : (FALLBACK_COORDS[city] || null);
}
function fmtShort(s) {
  return s ? new Date(s + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';
}
function addDays(s, n) {
  var d = new Date(s + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
}

// Attendee sidebar toggle
document.getElementById('sidebarToggle').addEventListener('click', function() {
  document.getElementById('sidebarPanel').classList.toggle('hidden');
});

// ── Boot ──────────────────────────────────────────────────────────────────────────────────────
fetch('data.json')
  .then(function(r) { return r.json(); })
  .then(function(data) {
    var attendees = data.attendees || [];
    var confirmed = attendees.filter(function(a) { return a.confirmed; });
    document.getElementById('goingCount').textContent = confirmed.length;

    if (data.trip && data.trip.startDate && data.trip.endDate) {
      document.getElementById('headerMeta').textContent =
        fmtShort(data.trip.startDate) + ' – ' + fmtShort(data.trip.endDate) + ', 2026';
    }

    renderSidebar(attendees);

    var itin  = data.itinerary || [];
    var stops = itin.filter(function(s) { return s.city !== 'Home'; });

    renderCalendarHero(data.trip || {}, itin, stops, data.hotels || []);
    renderStopsPanel(stops, data.citySuggestions || []);
    initMap(stops, data.citySuggestions || []);
  });

// ── Sidebar ─────────────────────────────────────────────────────────────────────────
function renderSidebar(attendees) {
  var confirmed = attendees.filter(function(a) { return a.confirmed; });
  var notGoing  = attendees.filter(function(a) { return !a.confirmed && a.notGoing; });
  function chip(a, cls, tag) {
    return '<div class="att-chip">' +
      '<div class="chip-av ' + cls + '">' + a.name.charAt(0) + '</div>' +
      '<span class="chip-name">' + a.name.split(' ')[0] + '</span>' +
      '<span class="chip-tag ' + cls + '">' + tag + '</span></div>';
  }
  var html = '<div class="sb-title">Going (' + confirmed.length + ')</div>';
  html += confirmed.map(function(a) { return chip(a, 'yes', 'Going'); }).join('');
  if (notGoing.length) {
    html += '<hr class="sdiv"><div class="sb-title">Not going</div>';
    html += notGoing.map(function(a) { return chip(a, 'no', 'No'); }).join('');
  }
  document.getElementById('attendeeChips').innerHTML = html;
}

// ── Calendar hero: the main focus of the homepage ──────────────────────────
function renderCalendarHero(trip, itin, stops, hotels) {

  // Check-in time for whichever pick is decided (booked, else picked) for
  // each stop, keyed by that stop's arrival date — so the calendar cell for
  // the day you actually walk in the door can say when you can.
  var arrivalTimes = {};
  stops.forEach(function(stop) {
    var pick = hotels.find(function(h) { return h.city === stop.city && h.status === 'booked'; }) ||
               hotels.find(function(h) { return h.city === stop.city && h.status === 'picked'; });
    if (pick && pick.checkInTime) arrivalTimes[stop.date] = pick.checkInTime;
  });

  // Build date → city info map. Each stop occupies its arrival date through its
  // checkout date (inclusive), so a checkout date that's also the next stop's
  // arrival date picks up both cities' colors — rendered below as a two-tone
  // gradient "travel day" (e.g. an early train out of one city and into the next).
  var EMPTY_COLOR = 'rgba(255,255,255,0.05)';
  var dayMap = {};
  stops.forEach(function(stop, i) {
    for (var n = 0; n <= (stop.nights || 0); n++) {
      var key = addDays(stop.date, n);
      if (!dayMap[key]) dayMap[key] = { colors: [], cities: [], emojis: [] };
      dayMap[key].colors.push(STOP_COLORS[i]);
      dayMap[key].cities.push(stop.city);
      dayMap[key].emojis.push(stop.emoji || '');
    }
  });

  // The very first day of the trip is a travel day too (flying in from home) —
  // gradient in from an empty cell into the first city. Most of that day is
  // still spent traveling, so the transition sits in the middle, not the edge.
  if (stops.length) {
    var firstKey = stops[0].date;
    if (dayMap[firstKey] && dayMap[firstKey].colors.length === 1) {
      dayMap[firstKey].colors.unshift(EMPTY_COLOR);
      dayMap[firstKey].cities.unshift('Home');
      dayMap[firstKey].emojis.unshift('✈️');
      dayMap[firstKey].partial = true;
    }
  }

  // The last day (flying home) mirrors that — mostly the last city's color,
  // gradient fading to an empty cell in the middle since a good chunk of that
  // day is spent traveling home, not in the city.
  var home = itin.find(function(s) { return s.city === 'Home'; });
  if (home && stops.length) {
    var lastStop = stops[stops.length - 1];
    dayMap[home.date] = {
      colors: [STOP_COLORS[stops.length - 1], EMPTY_COLOR],
      cities: [lastStop.city, 'Home'],
      emojis: [lastStop.emoji || '', '✈️'],
      reverse: true,
      partial: true
    };
  }

  // September 2026: Sep 1 = Tuesday (firstDay = 2)
  var firstDay    = new Date(2026, 8, 1).getDay(); // 2
  var daysInMonth = 30;

  var cal = '<div class="cal-grid">';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(function(d) {
    cal += '<div class="cal-wd">' + d + '</div>';
  });
  for (var b = 0; b < firstDay; b++) {
    cal += '<div class="cal-cell empty"></div>';
  }
  for (var d = 1; d <= daysInMonth; d++) {
    var key  = '2026-09-' + (d < 10 ? '0' : '') + d;
    var info = dayMap[key];
    if (info && info.colors.length > 1) {
      var fromCity = info.cities[0], toCity = info.cities[info.cities.length - 1];
      var grad = info.partial
        ? 'linear-gradient(90deg, ' + info.colors[0] + ' 0%, ' + info.colors[0] + ' 40%, ' +
          info.colors[info.colors.length - 1] + ' 60%, ' + info.colors[info.colors.length - 1] + ' 100%)'
        : info.reverse
        ? 'linear-gradient(90deg, ' + info.colors[0] + ' 0%, ' + info.colors[0] + ' 88%, ' +
          info.colors[info.colors.length - 1] + ' 95%, ' + info.colors[info.colors.length - 1] + ' 100%)'
        : 'linear-gradient(90deg, ' + info.colors[0] + ' 0%, ' + info.colors[0] + ' 5%, ' +
          info.colors[info.colors.length - 1] + ' 18%, ' + info.colors[info.colors.length - 1] + ' 100%)';
      var linkCity  = info.reverse ? fromCity : toCity;
      var toEmoji   = info.emojis[info.emojis.length - 1];
      var checkin   = arrivalTimes[key];
      var titleText = fromCity + ' → ' + toCity + ' (travel day)' + (checkin ? ' — check-in ' + checkin : '');
      cal += '<div class="cal-cell trip-day travel-day" style="background:' + grad + '" ' +
             'title="' + titleText + '" onclick="location.href=\'' + (CITY_PAGES[linkCity] || '#') + '\'">' +
             '<div class="cal-cell-top"><span class="cal-daynum">' + d + '</span>' +
             (checkin ? '<span class="cal-checkin">' + checkin + '</span>' : '') + '</div>' +
             '<span class="cal-emoji">' + toEmoji + '</span></div>';
    } else if (info) {
      var checkin2   = arrivalTimes[key];
      var titleText2 = info.cities[0] + (checkin2 ? ' — check-in ' + checkin2 : '');
      cal += '<div class="cal-cell trip-day" style="background:' + info.colors[0] + '" ' +
             'title="' + titleText2 + '" onclick="location.href=\'' + (CITY_PAGES[info.cities[0]] || '#') + '\'">' +
             '<div class="cal-cell-top"><span class="cal-daynum">' + d + '</span>' +
             (checkin2 ? '<span class="cal-checkin">' + checkin2 + '</span>' : '') + '</div>' +
             '<span class="cal-emoji">' + info.emojis[0] + '</span></div>';
    } else {
      cal += '<div class="cal-cell in-month"><span class="cal-daynum">' + d + '</span></div>';
    }
  }
  cal += '</div>';

  // Legend
  var legend = '<div class="cal-legend">';
  stops.forEach(function(stop, i) {
    legend += '<div class="cal-leg-chip"><div class="cal-leg-dot" style="background:' + STOP_COLORS[i] + '"></div>' +
              stop.flag + ' ' + stop.city + '</div>';
  });
  legend += '</div>';

  // Countdown — days until departure, or "underway" / "wrapped" once the
  // trip window has started or passed.
  var countdown = '';
  if (trip.startDate && trip.endDate) {
    var now   = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var start = new Date(trip.startDate + 'T00:00:00');
    var end   = new Date(trip.endDate + 'T00:00:00');
    var msPerDay = 86400000;
    if (today < start) {
      var daysLeft = Math.round((start - today) / msPerDay);
      countdown = '<div class="cal-countdown-num">' + daysLeft + '</div>' +
        '<div class="cal-countdown-label">day' + (daysLeft !== 1 ? 's' : '') + ' to go</div>';
    } else if (today >= start && today <= end) {
      var dayNum = Math.round((today - start) / msPerDay) + 1;
      countdown = '<div class="cal-countdown-num">Day ' + dayNum + '</div>' +
        '<div class="cal-countdown-label">trip is on</div>';
    } else {
      countdown = '<div class="cal-countdown-num">✓</div>' +
        '<div class="cal-countdown-label">trip complete</div>';
    }
  }

  var head = '<div class="cal-hero-head">' +
    '<div><div class="cal-hero-title">September 2026</div>' +
    '<div class="cal-hero-range">' + fmtShort(trip.startDate) + ' – ' + fmtShort(trip.endDate) + ', 2026</div></div>' +
    '<div class="cal-countdown">' + countdown + '</div>' +
    '</div>';

  document.getElementById('calHero').innerHTML = head + cal + legend;
}

// ── Stop cards + suggested cities ───────────────────────────────────────────
function renderStopsPanel(stops, suggestions) {
  var cards = '<div class="sec-title">Stops</div>';
  stops.forEach(function(stop, i) {
    var color = STOP_COLORS[i];
    var page  = CITY_PAGES[stop.city] || '#';
    var out   = fmtShort(addDays(stop.date, stop.nights || 0));
    cards += '<a class="stop-card" href="' + page + '" style="border-left-color:' + color + '">' +
      '<div class="stop-num" style="background:' + color + '">' + (i + 1) + '</div>' +
      '<div class="stop-body">' +
        '<div class="stop-name">' + (stop.flag || '') + ' ' + stop.city + '</div>' +
        '<div class="stop-dates">' + fmtShort(stop.date) + ' – ' + out + '</div>' +
        '<span class="stop-nights">' + stop.nights + ' night' + (stop.nights !== 1 ? 's' : '') + '</span>' +
      '</div>' +
      '<div class="stop-arrow">→</div>' +
      '</a>';
  });

  // Suggested cities
  var suggested = suggestions.filter(function(s) { return s.status === 'suggested'; });
  var sugg = '';
  if (suggested.length) {
    sugg = '<hr class="sec-div">' +
      '<button class="sugg-toggle" id="suggToggle">Suggested cities ▾</button>' +
      '<div class="sugg-grid" id="suggGrid" style="display:none">' +
      suggested.map(function(c) {
        return '<div class="sugg-chip">' +
          '<div class="sugg-chip-name">' + (c.emoji || '') + ' ' + (c.flag || '') + ' ' + c.name + '</div>' +
          '<div class="sugg-chip-blurb">' + (c.blurb || c.country || '') + '</div>' +
          '</div>';
      }).join('') +
      '</div>';
  }

  document.getElementById('stopsPanel').innerHTML = cards + sugg;

  var btn = document.getElementById('suggToggle');
  if (btn) {
    var open = false;
    btn.addEventListener('click', function() {
      open = !open;
      document.getElementById('suggGrid').style.display = open ? 'grid' : 'none';
      btn.textContent = open ? 'Suggested cities ▴' : 'Suggested cities ▾';
    });
  }
}

// ── Map ────────────────────────────────────────────────────────────────────────────────────────────
function initMap(stops, suggestions) {
  var map = L.map('map', { zoomControl: true });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
    maxZoom: 18,
    subdomains: 'abcd'
  }).addTo(map);

  var allCoords = [];

  // Suggested markers (subtle)
  suggestions.filter(function(s) { return s.status === 'suggested'; }).forEach(function(s) {
    var c = getCoords(s.name, s);
    if (!c) return;
    allCoords.push(c);
    var icon = L.divIcon({
      className: 'c-marker',
      html: '<div class="c-pin" style="width:20px;height:20px;background:#1C1A15;border-color:rgba(166,158,140,0.5)">' +
            '<span style="font-size:0.58rem;color:#EEE9DF">' + (s.emoji || '●') + '</span></div>',
      iconSize: [20, 20], iconAnchor: [10, 20], popupAnchor: [0, -24]
    });
    L.marker(c, { icon: icon }).addTo(map)
      .bindPopup('<strong>' + (s.flag || '') + ' ' + s.name + '</strong><br>' +
                 '<span style="font-size:0.74rem;color:var(--muted)">' + s.country + ' · Suggested</span>');
  });

  // Route line
  var routeCoords = stops.map(function(s) { return getCoords(s.city, s); }).filter(Boolean);
  if (routeCoords.length > 1) {
    L.polyline(routeCoords, { color: '#DD8452', weight: 2, opacity: 0.7, dashArray: '5 4' }).addTo(map);
  }

  // Planned stop markers
  stops.forEach(function(stop, i) {
    var c = getCoords(stop.city, stop);
    if (!c) return;
    allCoords.push(c);
    var color = STOP_COLORS[i];
    var page  = CITY_PAGES[stop.city] || '#';
    var out   = fmtShort(addDays(stop.date, stop.nights || 0));
    var icon  = L.divIcon({
      className: 'c-marker',
      html: '<div class="c-pin" style="width:32px;height:32px;background:' + color + '">' +
            '<span style="font-size:0.78rem">' + (i + 1) + '</span></div>',
      iconSize: [32, 32], iconAnchor: [16, 32], popupAnchor: [0, -36]
    });
    L.marker(c, { icon: icon }).addTo(map).bindPopup(
      '<strong>' + (stop.flag || '') + ' ' + stop.city + '</strong>, ' + stop.country +
      '<br>' + fmtShort(stop.date) + ' – ' + out +
      ' · ' + stop.nights + ' night' + (stop.nights !== 1 ? 's' : '') +
      (stop.notes ? '<br><em style="font-size:0.74rem;color:var(--muted)">' + stop.notes + '</em>' : '') +
      '<br><a class="popup-cta" href="' + page + '">View city →</a>'
    );
  });

  if (allCoords.length) map.fitBounds(allCoords, { padding: [44, 44] });
}
</script>

</body>
</html>
